name: Projects mode smoke

# Post-deploy gate for Upload Canvas project lists.
# Hits fdsGen, timeEq, radiation, and efs — the 2026-09 incident only smoked fdsGen
# and a /projects 500 was reported as CORS.
#
# Empty lists pass. 5xx, non-JSON, and missing CORS fail.
# Does not drive interactive Entra.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    # Daily, offset from round hours so it is not lost in the cron pile.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: API base URL (prod or dev). Leave blank for SMOKE_BASE_URL / production.
        required: false
        default: ""
      require_auth:
        description: Fail if password mint does not yield a session (turn on once AUTH_MODE=enforce).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: Smoke helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest httpx
      - name: pytest smoke helpers
        run: python -m pytest test_smoke_projects_modes.py -q

  live:
    name: Live /projects?mode= gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install httpx
        run: pip install httpx
      - name: Smoke all canvas modes
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.base_url || vars.SMOKE_BASE_URL || secrets.SMOKE_BASE_URL || 'https://backendfornextapp-production.up.railway.app' }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_READONLY: "1"
          SMOKE_REQUIRE_AUTH: ${{ github.event.inputs.require_auth && '1' || vars.SMOKE_REQUIRE_AUTH || secrets.SMOKE_REQUIRE_AUTH }}
        run: python scripts/smoke_projects_modes.py --readonly
